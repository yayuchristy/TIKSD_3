<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Simulator - SD Kelas 3 TIK</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #0b0f19; }

        /* WALLPAPER WINDOWS 11 */
        #desktop {
            width: 100vw; height: calc(100vh - 48px);
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            position: relative; padding: 20px;
            display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 15px;
        }

        .desktop-icon {
            width: 86px; text-align: center; color: white; cursor: pointer;
            padding: 8px; border-radius: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .desktop-icon:hover { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(5px); }
        .desktop-icon svg { width: 44px; height: 44px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.4)); }
        .desktop-icon span { font-size: 12px; word-break: break-word; line-height: 1.2; }

        /* TASKBAR WINDOWS 11 */
        #taskbar {
            width: 100vw; height: 48px; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px); position: fixed; bottom: 0; left: 0;
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .taskbar-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .tb-icon {
            width: 40px; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s;
        }
        .tb-icon:hover { background: rgba(255,255,255,0.1); }
        .tb-icon svg { width: 28px; height: 28px; }
        #clock { color: white; font-size: 12px; text-align: right; line-height: 1.3; font-weight: 500; cursor: default; }

        /* WINDOW STYLES */
        .window {
            position: absolute; background: #ffffff;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; min-width: 500px; min-height: 360px;
            z-index: 10; resize: both; overflow: hidden;
        }

        .window-header {
            background: #f1f5f9; padding: 10px 14px;
            display: flex; justify-content: space-between; align-items: center; cursor: move;
            border-bottom: 1px solid #e2e8f0;
        }
        .window-title { font-size: 13px; font-weight: 600; color: #1e293b; display: flex; align-items: center; gap: 8px; }
        .window-controls { display: flex; gap: 8px; }
        .win-btn {
            width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; display: inline-block;
        }
        .win-close { background: #ef4444; } .win-min { background: #f59e0b; } .win-max { background: #10b981; }

        .window-body { flex: 1; display: flex; overflow: hidden; background: #ffffff; }

        /* FILE EXPLORER SIDEBAR & TOOLBAR */
        .sidebar {
            width: 170px; background: #f8fafc; border-right: 1px solid #e2e8f0;
            padding: 12px 8px; display: flex; flex-direction: column; gap: 4px;
        }
        .sidebar-item {
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 10px; color: #334155; font-weight: 500;
        }
        .sidebar-item:hover { background: #e2e8f0; }
        .sidebar-item.active { background: #0284c7; color: white; }

        .explorer-main { flex: 1; display: flex; flex-direction: column; }
        .command-bar {
            background: #ffffff; padding: 8px 12px; border-bottom: 1px solid #e2e8f0;
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .cmd-btn {
            background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
            display: flex; align-items: center; gap: 6px; color: #334155; transition: all 0.15s;
        }
        .cmd-btn:hover { background: #0284c7; color: white; border-color: #0284c7; }
        .cmd-btn.danger:hover { background: #ef4444; border-color: #ef4444; }

        .address-bar {
            padding: 8px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;
            font-size: 13px; color: #64748b; font-weight: 500; display: flex; align-items: center; justify-content: space-between;
        }

        .file-grid {
            flex: 1; padding: 18px; display: flex; flex-wrap: wrap; gap: 16px;
            align-content: flex-start; overflow-y: auto; background: #ffffff;
        }
        .file-item {
            width: 105px; text-align: center; cursor: pointer; padding: 10px 6px;
            border-radius: 8px; border: 1px solid transparent; display: flex;
            flex-direction: column; align-items: center; gap: 6px; transition: all 0.15s;
        }
        .file-item:hover { background: #f0f9ff; border-color: #bae6fd; }
        .file-item.selected { background: #e0f2fe; border-color: #0284c7; }
        .file-item-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
        .file-item-icon img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; border: 1px solid #cbd5e1; }
        .file-item span { font-size: 12px; word-break: break-word; color: #1e293b; line-height: 1.2; max-width: 100%; }

        /* NOTEPAD & PAINT */
        .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        .app-toolbar { background: #f8fafc; padding: 8px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 10px; align-items: center; }
        .notepad-textarea {
            flex: 1; border: none; padding: 14px; font-family: 'Consolas', monospace;
            font-size: 14px; resize: none; outline: none; user-select: text;
        }
        #paint-canvas { flex: 1; background: white; cursor: crosshair; }

        /* SAVE AS DIALOG STYLES */
        .save-dialog-body { flex: 1; display: flex; flex-direction: column; background: #ffffff; }
        .save-dialog-footer {
            background: #f8fafc; padding: 12px 16px; border-top: 1px solid #e2e8f0;
            display: flex; flex-direction: column; gap: 10px;
        }
        .save-field-row { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 500; color: #334155; }
        .save-field-row label { width: 80px; text-align: right; }
        .save-field-row input, .save-field-row select {
            flex: 1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- DESKTOP AREA -->
    <div id="desktop">
        <div class="desktop-icon" onclick="openExplorer('D:')">
            <svg viewBox="0 0 48 48"><rect x="6" y="8" width="36" height="24" rx="3" fill="#0078D4"/><rect x="9" y="11" width="30" height="18" rx="1" fill="#60A5FA"/><path d="M18 32h12v6H18z" fill="#94A3B8"/><path d="M14 38h20v2H14z" fill="#64748B"/></svg>
            <span>Komputer Saya</span>
        </div>
        <div class="desktop-icon" onclick="openNotepad()">
            <svg viewBox="0 0 48 48"><path d="M10 6h28a2 2 0 0 1 2 2v32a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="#0078D4"/><path d="M14 12h20v26H14z" fill="#FFFFFF"/><path d="M18 18h12v2H18zm0 6h12v2H18zm0 6h8v2H18z" fill="#0078D4"/></svg>
            <span>Notepad</span>
        </div>
        <div class="desktop-icon" onclick="openPaint()">
            <svg viewBox="0 0 48 48"><path d="M24 4C12.95 4 4 12.95 4 24c0 11.05 8.95 20 20 20 2.5 0 4.5-2 4.5-4.5 0-1.15-.45-2.2-1.18-2.98-.71-.76-1.12-1.76-1.12-2.82 0-2.3 1.85-4.2 4.15-4.2H34c5.52 0 10-4.48 10-10C44 10.95 35.05 4 24 4z" fill="#FFC83B"/><circle cx="14" cy="20" r="3.5" fill="#E11D48"/><circle cx="22" cy="13" r="3.5" fill="#10B981"/><circle cx="32" cy="16" r="3.5" fill="#2563EB"/><circle cx="37" cy="25" r="3.5" fill="#8B5CF6"/></svg>
            <span>Paint Gambar</span>
        </div>
    </div>

    <!-- WINDOW: FILE EXPLORER -->
    <div id="win-explorer" class="window hidden" style="top: 40px; left: 100px; width: 720px; height: 460px;">
        <div class="window-header" onmousedown="dragWindow(event, 'win-explorer')">
            <div class="window-title">
                <svg width="18" height="18" viewBox="0 0 48 48"><path d="M40 12H22l-4-4H8c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h32c2.2 0 4-1.8 4-4V16c0-2.2-1.8-4-4-4z" fill="#FFA000"/><path d="M40 16H8c-2.2 0-4 1.8-4 4v16c0 2.2 1.8 4 4 4h32c2.2 0 4-1.8 4-4V20c0-2.2-1.8-4-4-4z" fill="#FFCA28"/></svg>
                File Explorer - Windows 11
            </div>
            <div class="window-controls">
                <button class="win-btn win-close" onclick="closeWindow('win-explorer')"></button>
            </div>
        </div>
        <div class="window-body">
            <div class="sidebar">
                <div class="sidebar-item" id="side-C" onclick="navigate('C:')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#64748b"><path d="M20 18H4V6h16v12zM4 4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4z"/></svg>
                    System (C:)
                </div>
                <div class="sidebar-item active" id="side-D" onclick="navigate('D:')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#0284c7"><path d="M20 18H4V6h16v12zM4 4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4z"/></svg>
                    Data (D:)
                </div>
            </div>
            <div class="explorer-main">
                <div class="command-bar">
                    <button class="cmd-btn" onclick="createNewFolder()">📁 Folder Baru</button>
                    <button class="cmd-btn" onclick="openNotepad()">📄 Teks Baru</button>
                    <button class="cmd-btn" onclick="openPaint()">🖼️ Gambar Baru</button>
                    <button class="cmd-btn" onclick="renameSelectedItem()">✏️ Ubah Nama</button>
                    <button class="cmd-btn danger" onclick="deleteSelectedItem()">🗑️ Hapus</button>
                </div>
                <div class="address-bar">
                    <span id="current-path">This PC > Data (D:)</span>
                    <button class="cmd-btn" style="padding: 2px 8px; font-size: 11px;" onclick="navigateUp()">⬆️ Ke Atas</button>
                </div>
                <div class="file-grid" id="file-grid" onclick="deselectAll(event)"></div>
            </div>
        </div>
    </div>

    <!-- WINDOW: NOTEPAD -->
    <div id="win-notepad" class="window hidden" style="top: 80px; left: 200px; width: 520px; height: 380px;">
        <div class="window-header" onmousedown="dragWindow(event, 'win-notepad')">
            <div class="window-title">📝 Notepad</div>
            <div class="window-controls"><button class="win-btn win-close" onclick="closeWindow('win-notepad')"></button></div>
        </div>
        <div class="window-body">
            <div class="app-container">
                <div class="app-toolbar">
                    <button class="cmd-btn" onclick="triggerSaveDialog('txt')">💾 Simpan Sebagai... (Save As)</button>
                </div>
                <textarea class="notepad-textarea" id="notepad-text" placeholder="Ketik tulisanmu di sini..."></textarea>
            </div>
        </div>
    </div>

    <!-- WINDOW: PAINT -->
    <div id="win-paint" class="window hidden" style="top: 90px; left: 240px; width: 540px; height: 420px;">
        <div class="window-header" onmousedown="dragWindow(event, 'win-paint')">
            <div class="window-title">🎨 Paint</div>
            <div class="window-controls"><button class="win-btn win-close" onclick="closeWindow('win-paint')"></button></div>
        </div>
        <div class="window-body">
            <div class="app-container">
                <div class="app-toolbar">
                    <button class="cmd-btn" onclick="triggerSaveDialog('png')">💾 Simpan Gambar... (Save As)</button>
                    <label style="font-size: 12px; font-weight: bold; margin-left: 10px;">Warna: <input type="color" id="paint-color" value="#ef4444"></label>
                    <button class="cmd-btn" onclick="clearCanvas()" style="margin-left: 10px;">🧹 Bersihkan</button>
                </div>
                <canvas id="paint-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- WINDOW: SAVE AS EXPLORER DIALOG -->
    <div id="win-save-dialog" class="window hidden" style="top: 100px; left: 220px; width: 580px; height: 420px; z-index: 99;">
        <div class="window-header" onmousedown="dragWindow(event, 'win-save-dialog')">
            <div class="window-title">💾 Simpan Sebagai (Save As)</div>
            <div class="window-controls"><button class="win-btn win-close" onclick="closeWindow('win-save-dialog')"></button></div>
        </div>
        <div class="window-body">
            <div class="save-dialog-body">
                <div class="address-bar">
                    <span id="save-dialog-path">This PC > Data (D:)</span>
                    <button class="cmd-btn" style="padding: 2px 8px; font-size: 11px;" onclick="dialogNavigateUp()">⬆️ Ke Atas</button>
                </div>
                <div class="file-grid" id="save-dialog-grid"></div>
                <div class="save-dialog-footer">
                    <div class="save-field-row">
                        <label for="save-file-name">Nama File:</label>
                        <input type="text" id="save-file-name" value="DokumenSaya">
                    </div>
                    <div class="save-field-row">
                        <label for="save-file-type">Tipe File:</label>
                        <select id="save-file-type" disabled>
                            <option value="txt">Text Document (*.txt)</option>
                            <option value="png">PNG Image (*.png)</option>
                        </select>
                        <button class="cmd-btn" style="background: #0284c7; color: white; padding: 6px 18px;" onclick="confirmSaveFile()">Simpan (Save)</button>
                        <button class="cmd-btn" onclick="closeWindow('win-save-dialog')">Batal</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- WINDOW: IMAGE VIEWER -->
    <div id="win-viewer" class="window hidden" style="top: 110px; left: 280px; width: 460px; height: 380px;">
        <div class="window-header" onmousedown="dragWindow(event, 'win-viewer')">
            <div class="window-title" id="viewer-title">🖼️ Lihat Gambar</div>
            <div class="window-controls"><button class="win-btn win-close" onclick="closeWindow('win-viewer')"></button></div>
        </div>
        <div class="window-body" style="background: #0f172a; justify-content: center; align-items: center; padding: 12px;">
            <img id="viewer-img" src="" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px;">
        </div>
    </div>

    <!-- TASKBAR -->
    <div id="taskbar">
        <div></div>
        <div class="taskbar-center">
            <div class="tb-icon" onclick="openExplorer('D:')">
                <svg viewBox="0 0 48 48"><path d="M40 12H22l-4-4H8c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h32c2.2 0 4-1.8 4-4V16c0-2.2-1.8-4-4-4z" fill="#FFA000"/><path d="M40 16H8c-2.2 0-4 1.8-4 4v16c0 2.2 1.8 4 4 4h32c2.2 0 4-1.8 4-4V20c0-2.2-1.8-4-4-4z" fill="#FFCA28"/></svg>
            </div>
            <div class="tb-icon" onclick="openNotepad()">
                <svg viewBox="0 0 48 48"><path d="M10 6h28a2 2 0 0 1 2 2v32a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="#0078D4"/><path d="M14 12h20v26H14z" fill="#FFFFFF"/></svg>
            </div>
            <div class="tb-icon" onclick="openPaint()">
                <svg viewBox="0 0 48 48"><path d="M24 4C12.95 4 4 12.95 4 24c0 11.05 8.95 20 20 20 2.5 0 4.5-2 4.5-4.5 0-1.15-.45-2.2-1.18-2.98-.71-.76-1.12-1.76-1.12-2.82 0-2.3 1.85-4.2 4.15-4.2H34c5.52 0 10-4.48 10-10C44 10.95 35.05 4 24 4z" fill="#FFC83B"/></svg>
            </div>
        </div>
        <div id="clock">10:00:00 AM<br>26/10/2026</div>
    </div>

    <script>
        // LIVE REAL-TIME CLOCK
        function updateLiveClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            const strHours = String(hours).padStart(2, '0');

            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();

            document.getElementById('clock').innerHTML = `${strHours}:${minutes}:${seconds} ${ampm}<br>${day}/${month}/${year}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // SVG SAMPLE IMAGES
        const samplePng1 = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150"><rect width="200" height="150" fill="%2338bdf8"/><circle cx="150" cy="40" r="20" fill="%23fef08a"/><polygon points="0,150 80,70 150,150" fill="%234ade80"/><polygon points="90,150 140,90 200,150" fill="%2316a34a"/></svg>`;
        const samplePng2 = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150"><rect width="200" height="150" fill="%23c084fc"/><circle cx="100" cy="75" r="35" fill="%23f472b6"/><circle cx="90" cy="65" r="4" fill="%231e293b"/><circle cx="110" cy="65" r="4" fill="%231e293b"/></svg>`;

        // FILE SYSTEM DATA
        let fileSystem = {
            'C:': [
                { name: 'Windows', type: 'folder', readonly: true, children: [] },
                { name: 'Program Files', type: 'folder', readonly: true, children: [] }
            ],
            'D:': [
                { name: 'Foto Kegiatan', type: 'folder', children: [] },
                { name: 'Tugas Sekolah', type: 'folder', children: [] },
                { name: 'Catatan Hari Ini.txt', type: 'file', ext: 'txt', content: 'Hari ini saya belajar membedakan file dan folder!' },
                { name: 'Pesan Rahasia.txt', type: 'file', ext: 'txt', content: 'Selamat! Kamu berhasil membuka file ini.' },
                { name: 'Pemandangan Gunung.png', type: 'file', ext: 'png', content: samplePng1 },
                { name: 'Kucing Lucu.png', type: 'file', ext: 'png', content: samplePng2 }
            ]
        };

        let currentDrive = 'D:';
        let currentFolder = null; // null means root drive
        let selectedItemIndex = null;

        let dialogDrive = 'D:';
        let dialogFolder = null;
        let activeSaveType = 'txt'; // 'txt' or 'png'

        // SVG ICON GENERATOR
        function createSvgIcon(type) {
            const container = document.createElement('div');
            container.className = 'file-item-icon';
            if (type === 'folder') {
                container.innerHTML = `<svg viewBox="0 0 48 48" width="48" height="48"><path d="M40 12H22l-4-4H8c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h32c2.2 0 4-1.8 4-4V16c0-2.2-1.8-4-4-4z" fill="#FFA000"/><path d="M40 16H8c-2.2 0-4 1.8-4 4v16c0 2.2 1.8 4 4 4h32c2.2 0 4-1.8 4-4V20c0-2.2-1.8-4-4-4z" fill="#FFCA28"/></svg>`;
            } else if (type === 'txt') {
                container.innerHTML = `<svg viewBox="0 0 48 48" width="48" height="48"><path fill="#0284c7" d="M37,45H11c-2.2,0-4-1.8-4-4V7c0-2.2,1.8-4,4-4h18l12,12v26C41,43.2,39.2,45,37,45z"/><path fill="#e0f2fe" d="M37,41H11V7h16v10h10V41z"/><path fill="#0284c7" d="M15 16h12v2H15zm0 6h18v2H15zm0 6h18v2H15zm0 6h12v2H15z"/></svg>`;
            }
            return container;
        }

        // EXPLORER NAVIGATION
        function openExplorer(drive) {
            document.getElementById('win-explorer').classList.remove('hidden');
            navigate(drive);
        }

        function navigate(drive) {
            currentDrive = drive;
            currentFolder = null;
            selectedItemIndex = null;
            
            document.getElementById('side-C').classList.toggle('active', drive === 'C:');
            document.getElementById('side-D').classList.toggle('active', drive === 'D:');
            
            renderFiles();
        }

        function navigateUp() {
            if (currentFolder) {
                currentFolder = null;
                renderFiles();
            }
        }

        function getCurrentItems(drive = currentDrive, folder = currentFolder) {
            if (!folder) return fileSystem[drive];
            let parent = fileSystem[drive].find(f => f.name === folder);
            if (!parent) return [];
            if (!parent.children) parent.children = [];
            return parent.children;
        }

        function renderFiles() {
            const grid = document.getElementById('file-grid');
            grid.innerHTML = '';
            
            let pathText = currentDrive === 'C:' ? 'This PC > System (C:)' : 'This PC > Data (D:)';
            if (currentFolder) pathText += ' > ' + currentFolder;
            document.getElementById('current-path').innerText = pathText;

            let items = getCurrentItems(currentDrive, currentFolder);

            items.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'file-item' + (selectedItemIndex === index ? ' selected' : '');
                
                if (item.type === 'folder') {
                    el.appendChild(createSvgIcon('folder'));
                } else if (item.type === 'file') {
                    if (item.ext === 'png') {
                        const iconBox = document.createElement('div');
                        iconBox.className = 'file-item-icon';
                        const img = document.createElement('img');
                        img.src = item.content;
                        iconBox.appendChild(img);
                        el.appendChild(iconBox);
                    } else {
                        el.appendChild(createSvgIcon('txt'));
                    }
                }

                const label = document.createElement('span');
                label.innerText = item.name;
                el.appendChild(label);

                el.onclick = (e) => {
                    e.stopPropagation();
                    selectedItemIndex = index;
                    renderFiles();
                };

                el.ondblclick = () => {
                    if (item.type === 'folder') {
                        currentFolder = item.name;
                        selectedItemIndex = null;
                        renderFiles();
                    } else if (item.type === 'file') {
                        if (item.ext === 'png') {
                            openImageViewer(item.name, item.content);
                        } else {
                            openNotepad(item.name, item.content);
                        }
                    }
                };

                grid.appendChild(el);
            });
        }

        function deselectAll(e) {
            selectedItemIndex = null;
            renderFiles();
        }

        // CREATE, RENAME, DELETE
        function createNewFolder() {
            if (currentDrive === 'C:') {
                alert('⚠️ Drive C: dikunci! Buat folder baru di Drive D: Data.');
                return;
            }
            const name = prompt('Masukkan nama folder baru:', 'Folder Baru');
            if (name) {
                const items = getCurrentItems(currentDrive, currentFolder);
                items.push({ name: name, type: 'folder', children: [] });
                renderFiles();
            }
        }

        function renameSelectedItem() {
            if (selectedItemIndex === null) {
                alert('Pilih folder atau file terlebih dahulu!');
                return;
            }
            const items = getCurrentItems(currentDrive, currentFolder);
            const item = items[selectedItemIndex];

            if (item.readonly) {
                alert('Folder sistem Windows tidak boleh diubah!');
                return;
            }

            const newName = prompt('Ubah nama menjadi:', item.name);
            if (newName) {
                item.name = newName;
                renderFiles();
            }
        }

        function deleteSelectedItem() {
            if (selectedItemIndex === null) {
                alert('Pilih folder atau file yang mau dihapus!');
                return;
            }
            const items = getCurrentItems(currentDrive, currentFolder);
            const item = items[selectedItemIndex];

            if (item.readonly) {
                alert('Folder sistem Windows tidak boleh dihapus!');
                return;
            }

            if (confirm(`Yakin ingin menghapus "${item.name}"?`)) {
                items.splice(selectedItemIndex, 1);
                selectedItemIndex = null;
                renderFiles();
            }
        }

        // NOTEPAD & PAINT APPS
        function openNotepad(fileName = '', content = '') {
            document.getElementById('win-notepad').classList.remove('hidden');
            document.getElementById('notepad-text').value = content;
        }

        let isDrawing = false;
        let canvas, ctx;

        function openPaint() {
            document.getElementById('win-paint').classList.remove('hidden');
            canvas = document.getElementById('paint-canvas');
            ctx = canvas.getContext('2d');
            
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight - 45;
            
            clearCanvas();

            canvas.onmousedown = (e) => { isDrawing = true; draw(e); };
            canvas.onmousemove = draw;
            canvas.onmouseup = () => isDrawing = false;
            canvas.onmouseleave = () => isDrawing = false;
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = document.getElementById('paint-color').value;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function clearCanvas() {
            if (!ctx) return;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
        }

        // REAL "SAVE AS" DIALOG LOGIC
        function triggerSaveDialog(type) {
            activeSaveType = type;
            const selectEl = document.getElementById('save-file-type');
            selectEl.value = type;

            const nameInput = document.getElementById('save-file-name');
            nameInput.value = type === 'txt' ? 'Tugas_Catatan' : 'Gambar_Karyaku';

            dialogDrive = 'D:';
            dialogFolder = null;
            renderSaveDialog();

            document.getElementById('win-save-dialog').classList.remove('hidden');
        }

        function dialogNavigateUp() {
            if (dialogFolder) {
                dialogFolder = null;
                renderSaveDialog();
            }
        }

        function renderSaveDialog() {
            const grid = document.getElementById('save-dialog-grid');
            grid.innerHTML = '';

            let pathText = dialogDrive === 'C:' ? 'This PC > System (C:)' : 'This PC > Data (D:)';
            if (dialogFolder) pathText += ' > ' + dialogFolder;
            document.getElementById('save-dialog-path').innerText = pathText;

            let items = getCurrentItems(dialogDrive, dialogFolder);

            items.forEach((item) => {
                const el = document.createElement('div');
                el.className = 'file-item';

                if (item.type === 'folder') {
                    el.appendChild(createSvgIcon('folder'));
                } else if (item.type === 'file') {
                    if (item.ext === 'png') {
                        const iconBox = document.createElement('div');
                        iconBox.className = 'file-item-icon';
                        const img = document.createElement('img');
                        img.src = item.content;
                        iconBox.appendChild(img);
                        el.appendChild(iconBox);
                    } else {
                        el.appendChild(createSvgIcon('txt'));
                    }
                }

                const label = document.createElement('span');
                label.innerText = item.name;
                el.appendChild(label);

                el.ondblclick = () => {
                    if (item.type === 'folder') {
                        dialogFolder = item.name;
                        renderSaveDialog();
                    }
                };

                grid.appendChild(el);
            });
        }

        function confirmSaveFile() {
            const rawName = document.getElementById('save-file-name').value.trim();
            if (!rawName) {
                alert('Nama file tidak boleh kosong!');
                return;
            }

            let fileContent = '';
            if (activeSaveType === 'txt') {
                fileContent = document.getElementById('notepad-text').value;
            } else {
                fileContent = canvas.toDataURL('image/png');
            }

            let finalExtension = '.' + activeSaveType;
            let fileName = rawName.endsWith(finalExtension) ? rawName : rawName + finalExtension;

            let targetItems = getCurrentItems(dialogDrive, dialogFolder);
            targetItems.push({
                name: fileName,
                type: 'file',
                ext: activeSaveType,
                content: fileContent
            });

            alert(`✅ File "${fileName}" berhasil disimpan ke folder tujuan!`);
            closeWindow('win-save-dialog');

            // Refresh explorer if open
            renderFiles();
        }

        // IMAGE VIEWER
        function openImageViewer(fileName, imgSrc) {
            document.getElementById('win-viewer').classList.remove('hidden');
            document.getElementById('viewer-title').innerText = '🖼️ Gambar: ' + fileName;
            document.getElementById('viewer-img').src = imgSrc;
        }

        // WINDOW CONTROLS
        function closeWindow(id) { document.getElementById(id).classList.add('hidden'); }

        function dragWindow(e, id) {
            const win = document.getElementById(id);
            let shiftX = e.clientX - win.getBoundingClientRect().left;
            let shiftY = e.clientY - win.getBoundingClientRect().top;

            function moveAt(pageX, pageY) {
                win.style.left = pageX - shiftX + 'px';
                win.style.top = pageY - shiftY + 'px';
            }

            function onMouseMove(event) { moveAt(event.pageX, event.pageY); }

            document.addEventListener('mousemove', onMouseMove);

            document.onmouseup = function() {
                document.removeEventListener('mousemove', onMouseMove);
                document.onmouseup = null;
            };
        }
    </script>
</body>
